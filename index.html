<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workout Tracker</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#0f172a">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased pb-20">
    <header class="bg-slate-800 p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-400">Dia 4: Lower</h1>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">
        <section class="bg-slate-800 rounded-xl overflow-hidden shadow-lg border border-slate-700">
            <div class="bg-slate-950 aspect-video relative flex items-center justify-center">
                <video src="" autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover opacity-80"></video>
                <span class="text-slate-500 text-sm z-10">Espaço do Vídeo (MP4)</span>
            </div>

            <div class="p-5">
                <h2 class="text-2xl font-bold mb-1">Agachamento no Smith</h2>
                <p class="text-sm text-slate-400 mb-4">Músculo Alvo: Quadríceps / Glúteos</p>

                <div class="bg-slate-700/50 rounded-lg p-3 mb-6 flex justify-between items-center border border-slate-600/50">
                    <span class="text-sm text-slate-300">Último Treino:</span>
                    <span class="font-mono font-bold text-blue-400">40kg × 10 reps</span>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Carga (kg)</label>
                        <input type="number" inputmode="decimal" placeholder="0" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-center text-xl font-bold text-white outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Repetições</label>
                        <input type="number" inputmode="numeric" placeholder="0" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-center text-xl font-bold text-white outline-none focus:border-blue-500">
                    </div>
                </div>

                <button class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-lg shadow-lg">
                    Registrar Série 1
                </button>
            </div>
        </section>

        <section class="px-2">
            <h3 class="text-sm font-semibold text-slate-400 uppercase mb-3">Séries de Hoje</h3>
            <ul class="space-y-2">
                <li class="bg-slate-800 rounded-lg p-3 flex justify-between items-center border border-slate-700 opacity-60">
                    <span class="text-slate-400 font-medium">Série 1</span>
                    <div class="font-mono text-slate-300">
                        <span class="font-bold text-white">40</span>kg × <span class="font-bold text-white">12</span>
                    </div>
                </li>
            </ul>
        </section>
    </main>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch(err => console.error('Erro no SW:', err));
            });
        }
    </script>
</body>
</html>
